services:
  - type: web
    name: orbital-shield-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://orbital-shield-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
